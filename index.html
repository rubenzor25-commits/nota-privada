*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  display: grid;
  place-items: center;
  padding: 16px;
  background: var(--fondo);
  color: var(--texto);
  font-family: "Avenir Next", Avenir, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
}
.caja {
  width: 100%;
  max-width: 380px;
  padding: 30px 26px 26px;
  border-radius: 18px;
  background: var(--superficie);
  border: 1px solid var(--borde);
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
  text-align: center;
}
.candado { width: 52px; height: 52px; margin: 0 auto 14px; display: grid; place-items: center; border-radius: 50%; background: var(--acento-suave); }
h1 { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; font-weight: 600; font-size: 1.5rem; margin: 0 0 6px; }
p { margin: 0 0 18px; color: var(--texto-suave); font-size: 0.95rem; }
label { display: block; text-align: left; font-size: 0.8rem; font-weight: 600; color: var(--texto-suave); margin-bottom: 6px; }
.fila { position: relative; }
input {
  width: 100%;
  font: inherit;
  font-size: 1rem;
  padding: 12px 74px 12px 14px;
  border-radius: 10px;
  border: 1px solid var(--borde);
  background: var(--fondo);
  color: var(--texto);
}
input:focus { outline: 3px solid var(--acento); outline-offset: 1px; }
.ver {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  border: 0; background: transparent; color: var(--acento); font: inherit; font-size: 0.85rem; font-weight: 600; padding: 8px; cursor: pointer;
}
button.entrar {
  width: 100%; margin-top: 14px; padding: 12px; border: 0; border-radius: 10px;
  background: var(--acento); color: var(--acento-texto); font: inherit; font-weight: 700; font-size: 1rem; cursor: pointer;
}
button.entrar:disabled { opacity: 0.6; cursor: progress; }
.error { min-height: 1.4em; margin: 12px 0 0; color: var(--peligro); font-size: 0.9rem; font-weight: 600; }
noscript { display: block; margin-top: 12px; color: var(--peligro); }
</style>

<main class="caja">

  </div>
  <h1>Página privada</h1>
  <p>Escribe la contraseña para verla.</p>

    <p class="error" id="error" role="alert"></p>
  </form>

</main>
